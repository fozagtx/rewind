zerops:
  - setup: rewind
    build:
      base: nodejs@22
      buildCommands:
        - npm ci
      deployFiles:
        - src
        - package.json
        - package-lock.json
        - node_modules
        - README.md
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        NODE_ENV: production
        PORT: '3000'
        REWIND_DATA_DIR: /var/www/data
        # The project this deployment reports on. Zerops injects its own id, so
        # the service describes itself with no manual wiring. The ZEROPS_ prefix
        # is reserved by the platform, hence REWIND_PROJECT_ID.
        REWIND_PROJECT_ID: ${projectId}
      start: npm run serve
      healthCheck:
        httpGet:
          port: 3000
          path: /health
